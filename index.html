<div class="right">
<section class="panel" aria-labelledby="playTitle"><h2 class="panel-title" id="playTitle">想怎麼鬧奶蛙？ ✨</h2><p class="panel-desc">六種戳法，六種反應。準備接受牠的吐槽吧！</p><div class="actions"><button class="action" type="button" data-action="head"><span class="emoji" aria-hidden="true">👋</span><span>摸摸頭</span></button><button class="action" type="button" data-action="eye"><span class="emoji" aria-hidden="true">👀</span><span>戳眼睛</span></button><button class="action" type="button" data-action="mouth"><span class="emoji" aria-hidden="true">👅</span><span>戳嘴巴</span></button><button class="action" type="button" data-action="belly"><span class="emoji" aria-hidden="true">🫧</span><span>戳肚子</span></button><button class="action" type="button" data-action="hand"><span class="emoji" aria-hidden="true">✌️</span><span>戳雙手</span></button><button class="action" type="button" data-action="foot"><span class="emoji" aria-hidden="true">🦶</span><span>戳雙腳</span></button></div></section>
<section class="panel" aria-label="累積互動次數"><div class="stats-top"><span class="stats-label">🎯 累積戳奶蛙次數</span><button type="button" id="reset" class="reset">↻ 重置次數</button></div><div class="count" id="count" aria-live="polite">0 <small>次</small></div><p class="mini">每戳一下都算數！紀錄保存在這台裝置的瀏覽器裡。</p></section>

</main>
<script>
(()=>{'use strict';
const reactions={
head:{cls:'anim-head',duration:600,words:['再摸要收費了！','我的頭是公共財嗎？','手拿開啦！','摸頭可以，但要排隊！'],fx:'喂！'},
eye:{cls:'anim-eye',duration:500,words:['你禮貌嗎？','我看到宇宙了！','眼睛不是按鈕！','我的眼睛有保險嗎？'],fx:'！？'},
mouth:{cls:'anim-mouth',duration:700,words:['呱！！！','想被舔是不是？','嘴巴不要亂戳！','再戳我就唱歌！'],fx:'呱！'},
belly:{cls:'anim-belly',duration:800,words:['這是腹肌！','不要戳我的鮪魚肚！','ㄉㄨㄞ～','我的肚子有自己的想法！'],fx:'ㄉㄨㄞ！'},
hand:{cls:'anim-hand',duration:650,words:['不要亂碰我的手手！','這是我的無敵剪刀手！','想跟本蛙擊掌嗎？','手手很忙，請稍後再撥！'],fx:'啪！'},
foot:{cls:'anim-foot',duration:650,words:['你踩到我的腳了啦！','蛙腿不是雞腿！','我要跳走了喔！','這雙腿可是練過的！'],fx:'咚！'}
};
const img=document.getElementById('frogImg'), bubble=document.getElementById('bubble'), comic=document.getElementById('comic'), sparkles=document.getElementById('sparkles'), countEl=document.getElementById('count'), soundBtn=document.getElementById('soundBtn');
const storeKey='naiwa-poke-count-v2';let count=0;try{const raw=localStorage.getItem(storeKey);const n=Number(raw);if(raw!==null&&Number.isSafeInteger(n)&&n>=0)count=n}catch(_){/* storage may be unavailable */}
const updateCount=()=>{countEl.innerHTML=String(count).replace(/&/g,'&amp;')+' <small>次</small>'};updateCount();
let soundOn=true,audioCtx=null,playing=[],animationTimer=null,fxTimer=null,lastWord={};
function stopSound(){for(const source of playing){try{source.stop()}catch(_){}}playing=[]}
// 六個部位使用六種不同的電子合成音色，不依賴外部音檔。
function tone(freq,start,duration,type='sine',gain=.09,endFreq=null){
 if(!audioCtx)return;
 const osc=audioCtx.createOscillator(),vol=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,start);
 if(endFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),start+duration);
 vol.gain.setValueAtTime(.0001,start);
 vol.gain.exponentialRampToValueAtTime(Math.max(.0001,gain),start+Math.min(.012,duration/4));
 vol.gain.exponentialRampToValueAtTime(.0001,start+duration);
 osc.connect(vol);vol.connect(audioCtx.destination);
 osc.start(start);osc.stop(start+duration+.02);playing.push(osc);
}
function sound(action){
 if(!soundOn)return;
 try{
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context)return;
  if(!audioCtx)audioCtx=new Context();
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  stopSound();const t=audioCtx.currentTime+.018;
  switch(action){
   case 'head': // 輕柔「啵、啵」，兩個圓潤的高音
    tone(470,t,.095,'sine',.10,720);
    tone(570,t+.145,.12,'sine',.11,860);break;
   case 'eye': // 驚訝「叮！」，明亮、快速上滑的鈴音
    tone(1150,t,.26,'sine',.075,1650);
    tone(2300,t,.18,'sine',.018,3300);break;
   case 'mouth': // 滑稽「呱～」，顫動的粗音下滑
    tone(360,t,.32,'sawtooth',.045,115);
    tone(250,t+.09,.27,'triangle',.065,85);
    tone(405,t+.20,.13,'sawtooth',.025,155);break;
   case 'belly': // 果凍「ㄉㄨㄞ」，低音彈簧下沉後回彈
    tone(190,t,.29,'sine',.16,57);
    tone(95,t+.17,.20,'triangle',.07,170);break;
   case 'hand': // 「啪！啪！」兩下短促拍手般的方波
    tone(820,t,.055,'square',.045,230);
    tone(900,t+.13,.063,'square',.052,200);break;
   case 'foot': // 「咚、咚」，兩下分開的沉重鼓點
    tone(145,t,.16,'triangle',.16,42);
    tone(125,t+.23,.20,'triangle',.17,38);break;
  }
 }catch(_){/* 裝置禁用聲音時，其他互動仍正常 */}
}
function pick(action){const all=reactions[action].words;const options=all.filter(w=>w!==lastWord[action]);const pool=options.length?options:all;const word=pool[Math.floor(Math.random()*pool.length)];lastWord[action]=word;return word}
function showFx(action){comic.textContent=reactions[action].fx;comic.style.left=action==='foot'?'60%':action==='hand'?'69%':action==='belly'?'66%':action==='head'?'67%':'71%';comic.style.top=action==='foot'?'76%':action==='hand'?'18%':action==='belly'?'58%':action==='eye'?'12%':'27%';comic.classList.remove('show');sparkles.classList.remove('show');void comic.offsetWidth;comic.classList.add('show');if(action==='eye')sparkles.classList.add('show');clearTimeout(fxTimer);fxTimer=setTimeout(()=>{comic.classList.remove('show');sparkles.classList.remove('show')},640)}
function interact(action){const r=reactions[action];if(!r)return;count+=1;try{localStorage.setItem(storeKey,String(count))}catch(_){}updateCount();countEl.classList.remove('shake-small');void countEl.offsetWidth;countEl.classList.add('shake-small');bubble.textContent=pick(action);bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop');clearTimeout(animationTimer);img.classList.remove(...Object.values(reactions).map(r=>r.cls));void img.offsetWidth;img.classList.add(r.cls);animationTimer=setTimeout(()=>img.classList.remove(r.cls),r.duration);showFx(action);sound(action)}
document.querySelectorAll('[data-action]').forEach(el=>{el.addEventListener('click',e=>{e.preventDefault();interact(el.dataset.action)});if(el.tagName.toLowerCase()==='path'||el.tagName.toLowerCase()==='ellipse'){el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();interact(el.dataset.action)}})}});
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.setAttribute('aria-pressed',String(soundOn));soundBtn.setAttribute('aria-label',soundOn?'關閉音效':'開啟音效');soundBtn.textContent=soundOn?'🔊 音效開啟':'🔇 音效關閉';if(!soundOn)stopSound()});
document.getElementById('reset').addEventListener('click',()=>{count=0;try{localStorage.setItem(storeKey,'0')}catch(_){}updateCount();bubble.textContent='從零開始？你很會欸！';bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop')});
})();
</script>
